<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>La Mia Cantina</title>
    
    <!-- PWA & Mobile Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cantina">
    <meta name="theme-color" content="#1a090d">
    
    <!-- PWA Manifest Dynamic Generation -->
    <script>
        const manifest = {
            "name": "La Mia Cantina",
            "short_name": "Cantina",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#1a090d",
            "theme_color": "#1a090d",
            "icons": [
                {
                    "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512' fill='%23d4af37'><rect width='512' height='512' rx='100' fill='%232c0d12'/><path d='M256 64c-35.3 0-64 28.7-64 64 0 23.8 12.9 44.6 32 55.8V288c0 17.7 14.3 32 32 32s32-14.3 32-32V183.8c19.1-11.2 32-32 32-55.8 0-35.3-28.7-64-64-64zm-192 64c0 88.4 71.6 160 160 160v128H160c-17.7 0-32 14.3-32 32s14.3 32 32 32h192c17.7 0 32-14.3 32-32s-14.3-32-32-32h-64V288c88.4 0 160-71.6 160-160V64H64v64z' fill='%23d4af37'/></svg>",
                    "sizes": "512x512",
                    "type": "image/svg+xml"
                }
            ]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #120608;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .font-serif-title {
            font-family: 'Cinzel', serif;
        }
        .bg-wine-dark { background-color: #1a090d; }
        .bg-wine-card { background-color: #240d13; }
        .bg-wine-accent { background-color: #58111a; }
        .border-gold { border-color: rgba(212, 175, 55, 0.3); }
        .text-gold { color: #d4af37; }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #120608;
        }
        .btn-gold:active {
            opacity: 0.9;
            transform: scale(0.98);
        }
        .glass-panel {
            background: rgba(36, 13, 19, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #120608; }
        ::-webkit-scrollbar-thumb { background: #58111a; border-radius: 4px; }
    </style>
</head>
<body class="pb-24 pt-safe min-h-screen select-none">

    <!-- Header App -->
    <header class="sticky top-0 z-30 glass-panel border-b border-wine-accent/40 px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-full bg-gradient-to-br from-amber-500 to-red-900 flex items-center justify-center text-amber-200 font-bold shadow-lg">
                    <i class="fa-solid fa-wine-glass text-lg"></i>
                </div>
                <div>
                    <h1 class="font-serif-title text-lg font-bold text-amber-100 tracking-wide leading-none">La Mia Cantina</h1>
                    <span id="network-badge" class="text-[10px] uppercase tracking-wider text-emerald-400 font-semibold flex items-center gap-1 mt-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online
                    </span>
                </div>
            </div>
            
            <div class="flex items-center gap-1">
                <button onclick="document.getElementById('import-file').click()" class="p-2 text-amber-200/80 hover:text-amber-200 active:scale-95 transition" title="Importa Backup">
                    <i class="fa-solid fa-file-import text-lg"></i>
                </button>
                <input type="file" id="import-file" accept=".json" class="hidden" onchange="importData(event)">
                
                <button onclick="exportData()" class="p-2 text-amber-200/80 hover:text-amber-200 active:scale-95 transition" title="Esporta Backup">
                    <i class="fa-solid fa-file-export text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="max-w-md mx-auto grid grid-cols-2 gap-2 mt-3 p-1 bg-black/40 rounded-xl border border-white/5">
            <button id="tab-cantina" onclick="switchTab('cantina')" class="py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2 btn-gold shadow-md">
                <i class="fa-solid fa-boxes-stacked"></i> In Cantina <span id="count-cantina" class="bg-black/30 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
            </button>
            <button id="tab-storico" onclick="switchTab('storico')" class="py-2 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-clock-rotate-left"></i> Storico Bevute <span id="count-storico" class="bg-white/10 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Bar di Ricerca e Filtri -->
        <div class="space-y-3 mb-5">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                <input type="text" id="search-input" oninput="render()" placeholder="Cerca vino, cantina, zona..." 
                    class="w-full bg-wine-card/80 border border-wine-accent/50 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-amber-500/80 transition">
            </div>

            <!-- Filtri Orizzontali -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar text-xs">
                <button onclick="setFilter('all')" id="filter-all" class="px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-200 border border-amber-500/40 font-medium whitespace-nowrap">Tutti</button>
                <button onclick="setFilter('rosso')" id="filter-rosso" class="px-3 py-1.5 rounded-lg bg-wine-card text-gray-300 border border-white/5 whitespace-nowrap">🔴 Rossi</button>
                <button onclick="setFilter('bianco')" id="filter-bianco" class="px-3 py-1.5 rounded-lg bg-wine-card text-gray-300 border border-white/5 whitespace-nowrap">🟡 Bianchi</button>
                <button onclick="setFilter('rose')" id="filter-rose" class="px-3 py-1.5 rounded-lg bg-wine-card text-gray-300 border border-white/5 whitespace-nowrap">🌸 Rosé</button>
                <button onclick="setFilter('bollicine')" id="filter-bollicine" class="px-3 py-1.5 rounded-lg bg-wine-card text-gray-300 border border-white/5 whitespace-nowrap">🥂 Bollicine</button>
            </div>
        </div>

        <!-- Lista Vini -->
        <div id="wine-list" class="space-y-3.5"></div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-12 px-4">
            <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-wine-card border border-wine-accent/30 flex items-center justify-center text-amber-400/50 text-2xl">
                <i class="fa-solid fa-wine-bottle"></i>
            </div>
            <h3 class="font-serif-title text-lg text-gray-300 font-medium">Nessun vino trovato</h3>
            <p class="text-xs text-gray-500 mt-1 max-w-xs mx-auto">Tocca il pulsante "+" in basso per aggiungere la tua prima bottiglia in cantina.</p>
        </div>
    </main>

    <!-- Floating Action Button -->
    <button onclick="openModal()" class="fixed bottom-6 right-6 w-14 h-14 rounded-full btn-gold shadow-2xl flex items-center justify-center text-2xl z-40 active:scale-90 transition-transform border border-amber-300/50">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- MODALE AGGIUNGI / MODIFICA VINO -->
    <div id="modal-wine" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 transition-opacity">
        <div class="bg-wine-dark border-t sm:border border-wine-accent/60 w-full max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] overflow-y-auto p-5 shadow-2xl space-y-4">
            
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 id="modal-title" class="font-serif-title text-lg font-bold text-amber-200">Nuova Bottiglia</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="wine-form" onsubmit="saveWine(event)" class="space-y-3.5 text-xs">
                <input type="hidden" id="wine-id">

                <!-- NOME + TASTO COMPILAZIONE AUTOMATICA -->
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Nome del Vino *</label>
                    <div class="flex gap-2">
                        <input type="text" id="form-nome" required placeholder="Es. Barolo, Amarone, Tignanello..." 
                            class="flex-1 bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500">
                        <button type="button" id="btn-autofill" onclick="autoCompileWine()" 
                            class="px-3 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/50 font-semibold flex items-center gap-1.5 whitespace-nowrap active:scale-95 transition"
                            title="Compila automaticamente tipologia, zona e dettagli">
                            <i class="fa-solid fa-wand-magic-sparkles"></i>
                            <span class="text-[11px]">Compila</span>
                        </button>
                    </div>
                    <p id="autofill-status" class="text-[10px] text-amber-400/90 mt-1 hidden"></p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="relative">
                        <label class="block text-gray-400 mb-1 font-medium">Cantina / Produttore *</label>
                        <input type="text" id="form-cantina" required placeholder="Es. Antinori" oninput="autocompleteRegion(this.value)"
                            class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500">
                        <div id="cantina-suggestions" class="absolute left-0 right-0 top-full mt-1 bg-wine-card border border-wine-accent rounded-xl shadow-xl z-20 hidden max-h-36 overflow-y-auto"></div>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Zona / Valle / Regione</label>
                        <input type="text" id="form-regione" placeholder="Auto-completata o inserisci" 
                            class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Colore</label>
                        <select id="form-colore" class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-2 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="rosso">🔴 Rosso</option>
                            <option value="bianco">🟡 Bianco</option>
                            <option value="rose">🌸 Rosé</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Tipologia</label>
                        <select id="form-stile" class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-2 py-2.5 text-xs text-white focus:outline-none focus:border-amber-500">
                            <option value="fermo">Fermo</option>
                            <option value="frizzante">Frizzante</option>
                            <option value="spumante">Spumante / Metodo Classico</option>
                            <option value="passito">Passito / Dolce</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Annata</label>
                        <input type="number" id="form-annata" placeholder="2020" min="1900" max="2030"
                            class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-2.5 py-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Quantità in Cantina</label>
                        <input type="number" id="form-quantita" min="0" value="1" required
                            class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-gray-400 mb-1 font-medium">Voto (1-5 Stelle)</label>
                        <select id="form-voto" class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-2 py-2 text-sm text-amber-300 focus:outline-none focus:border-amber-500">
                            <option value="0">Nessun Voto</option>
                            <option value="5">⭐⭐⭐⭐⭐ Superbe</option>
                            <option value="4">⭐⭐⭐⭐ Molto Buono</option>
                            <option value="3">⭐⭐⭐ Buono</option>
                            <option value="2">⭐⭐ Discreto</option>
                            <option value="1">⭐ Deludente</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Note Personali / Abbinamenti</label>
                    <textarea id="form-note" rows="2" placeholder="Note organolettiche, dove l'hai comprato, abbinamento consigliato..."
                        class="w-full bg-wine-card border border-wine-accent/50 rounded-xl p-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeModal()" class="w-1/3 py-3 rounded-xl bg-white/5 text-gray-300 font-semibold hover:bg-white/10 transition">Annulla</button>
                    <button type="submit" class="w-2/3 py-3 rounded-xl btn-gold font-bold shadow-lg">Salva Bottiglia</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODALE REGISTRA BEVUTA / EVENTO -->
    <div id="modal-drink" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-wine-dark border-t sm:border border-wine-accent/60 w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 class="font-serif-title text-lg font-bold text-amber-200">🍷 Registra Bevuta</h2>
                <button onclick="closeDrinkModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="drink-form" onsubmit="confirmDrink(event)" class="space-y-3.5 text-xs">
                <input type="hidden" id="drink-wine-id">

                <p id="drink-wine-name" class="text-sm font-semibold text-amber-100 bg-black/30 p-2.5 rounded-xl border border-white/5"></p>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Data Stappata</label>
                    <input type="date" id="drink-date" required
                        class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Evento / Occasione</label>
                    <input type="text" id="drink-evento" placeholder="Es. Cena di compleanno con Marco, Natale, Grigliata..."
                        class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Voto Finale / Impressione</label>
                    <select id="drink-voto" class="w-full bg-wine-card border border-wine-accent/50 rounded-xl px-2 py-2 text-sm text-amber-300 focus:outline-none focus:border-amber-500">
                        <option value="5">⭐⭐⭐⭐⭐ Capolavoro</option>
                        <option value="4">⭐⭐⭐⭐ Ottimo</option>
                        <option value="3">⭐⭐⭐ Buono</option>
                        <option value="2">⭐⭐ Così così</option>
                        <option value="1">⭐ Non piaciuto</option>
                    </select>
                </div>

                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Note della Serata</label>
                    <textarea id="drink-note" rows="2" placeholder="Com'era il vino? Pronto, da aspettare, abbinamento riuscito?"
                        class="w-full bg-wine-card border border-wine-accent/50 rounded-xl p-2.5 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-amber-500"></textarea>
                </div>

                <div class="pt-2 flex gap-2">
                    <button type="button" onclick="closeDrinkModal()" class="w-1/3 py-3 rounded-xl bg-white/5 text-gray-300 font-semibold">Annulla</button>
                    <button type="submit" class="w-2/3 py-3 rounded-xl bg-red-800 hover:bg-red-700 text-white font-bold shadow-lg">Sposta nello Storico</button>
                </div>
            </form>
        </div>
    </div>

            { keys: ["trentodoc", "giulio ferrari", "ferrari perlé"], colore: "bianco", stile: "spumante", regione: "Trentino-Alto Adige", note: "Metodo Classico di montagna. Freschezza vibrante, ideale con crostacei e antipasti." },
            { keys: ["champagne", "dom perignon", "krug", "veuve clicquot", "bollinger", "moet"], colore: "bianco", stile: "spumante", regione: "Champagne, Francia", note: "Metodo Champenoise. Note di crosta di pane e agrumi, perfetto per brindisi, ostriche e pesce." },
            { keys: ["gewurztraminer", "traminer"], colore: "bianco", stile: "fermo", regione: "Alto Adige (Südtirol)", note: "Aromatico con note di litchi, rosa e spezie. Ottimo con cucina asiatica, crostacei e formaggi erborinati." },
            { keys: ["pinot grigio", "pinot bianco", "muller thurgau", "kerner", "sauvignon"], colore: "bianco", stile: "fermo", regione: "Trentino-Alto Adige / Friuli", note: "Fresco, minerale e floreale. Ideale con piatti di pesce, verdure e primi delicati." },
            { keys: ["lugana"], colore: "bianco", stile: "fermo", regione: "Lombardia / Veneto (Lago di Garda)", note: "Vitigno Turbiana. Sapido e avvolgente, perfetto con pesce di lago e risotti." },
            { keys: ["vermentino"], colore: "bianco", stile: "fermo", regione: "Sardegna / Liguria / Toscana", note: "Fresco e sapido con note agrumate, abbinamento perfetto con frutti di mare e grigliate di pesce." },
            { keys: ["primitivo", "manduria"], colore: "rosso", stile: "fermo", regione: "Puglia (Salento / Manduria)", note: "Corposo, caldo e fruttato (prugna, confettura). Ottimo con carni alla brace e formaggi stagionati." },
            { keys: ["negroamaro"], colore: "rosso", stile: "fermo", regione: "Puglia (Salento)", note: "Intenso, leggermente amarognolo sul finale, ideale con piatti saporiti della cucina mediterranea." },
            { keys: ["nero d'avola"], colore: "rosso", stile: "fermo", regione: "Sicilia", note: "Strutturato con note di frutti rossi maturi e spezie. Perfetto con carni arrostite e melanzane." },
            { keys: ["etna rosso", "nerello mascalese"], colore: "rosso", stile: "fermo", regione: "Sicilia (Etna)", note: "Vulcanico, minerale ed elegante. Ideale con carni bianche, funghi e tonno scottato." },
            { keys: ["etna bianco", "carricante", "grillo"], colore: "bianco", stile: "fermo", regione: "Sicilia", note: "Fresco e minerale, ottimo con crudi di mare, pesce al forno e agrumi." },
            { keys: ["montepulciano"], colore: "rosso", stile: "fermo", regione: "Abruzzo", note: "Morbido, intenso e fruttuoso. Perfetto con arrosticini, primi al ragù e formaggi." },
            { keys: ["lambrusco"], colore: "rosso", stile: "frizzante", regione: "Emilia-Romagna", note: "Vivace e fresco, compagno ideale di salumi, tigelle, lasagne e tortellini." },
            { keys: ["franciacorta rosé", "cerasuolo", "chiaretto"], colore: "rose", stile: "fermo", regione: "Abruzzo / Lombardia / Veneto", note: "Fresco, elegante e versatile: perfetto con pizza gourmet, pesce in umido e salumi." },
            { keys: ["passito", "vin santo", "moscato", "recioto", "sauternes"], colore: "bianco", stile: "passito", regione: "Italia / Francia", note: "Vino dolce da meditazione, perfetto con pasticceria secca, cioccolato o formaggi erborinati." }
        ];

        // State Management
        let wines = JSON.parse(localStorage.getItem('my_wine_cellar_db')) || [];
        let currentTab = 'cantina';
        let currentFilter = 'all';

        // Service Worker Offline Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'cantina-v2';
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./'])));
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
                    });
                `;
                const blob = new Blob([swCode], {type: 'application/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }

        // Online / Offline Status Detection
        function updateNetworkStatus() {
            const badge = document.getElementById('network-badge');
            if (navigator.onLine) {
                badge.className = "text-[10px] uppercase tracking-wider text-emerald-400 font-semibold flex items-center gap-1 mt-0.5";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Online`;
            } else {
                badge.className = "text-[10px] uppercase tracking-wider text-amber-400 font-semibold flex items-center gap-1 mt-0.5";
                badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span> Offline (Locale)`;
            }
        }
        window.addEventListener('online', updateNetworkStatus);
        window.addEventListener('offline', updateNetworkStatus);

        // FUNZIONE COMPILAZIONE AUTOMATICA SMART / AI INTERNA
        async function autoCompileWine() {
            const nomeInput = document.getElementById('form-nome').value.trim();
            const statusEl = document.getElementById('autofill-status');
            const btn = document.getElementById('btn-autofill');

            if (!nomeInput) {
                statusEl.innerText = "⚠️ Scrivi prima il nome del vino per compilarlo!";
                statusEl.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span class="text-[11px]">Analisi...</span>`;
            statusEl.innerText = "🔍 Ricerca caratteristiche del vino in corso...";
            statusEl.classList.remove('hidden');

            const queryLower = nomeInput.toLowerCase();
            let matched = false;

            const yearMatch = nomeInput.match(/(19\d{2}|20[0-2]\d)/);
            if (yearMatch && !document.getElementById('form-annata').value) {
                document.getElementById('form-annata').value = yearMatch[0];
            }

            for (const [cantinaKey, regVal] of Object.entries(CANTINA_DB)) {
                if (queryLower.includes(cantinaKey.toLowerCase())) {
                    if (!document.getElementById('form-cantina').value) {
                        document.getElementById('form-cantina').value = cantinaKey;
                    }
                    if (!document.getElementById('form-regione').value) {
                        document.getElementById('form-regione').value = regVal;
                    }
                    matched = true;
                    break;
                }
            }

            for (const item of WINE_KNOWLEDGE) {
                if (item.keys.some(k => queryLower.includes(k))) {
                    document.getElementById('form-colore').value = item.colore;
                    document.getElementById('form-stile').value = item.stile;
                    if (!document.getElementById('form-regione').value) {
                        document.getElementById('form-regione').value = item.regione;
                    }
                    if (!document.getElementById('form-note').value) {
                        document.getElementById('form-note').value = item.note;
                    }
                    matched = true;
                    break;
                }
            }

            if (navigator.onLine && (!matched || !document.getElementById('form-note').value)) {
                try {
                    const cleanQuery = nomeInput.replace(/(19\d{2}|20[0-2]\d)/g, '').trim();
                    const res = await fetch(`https://it.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(cleanQuery + " vino")}&format=json&origin=*`);
                    const data = await res.json();
                    
                    if (data.query && data.query.search && data.query.search.length > 0) {
                        const snippet = data.query.search[0].snippet.replace(/<\/?[^>]+(>|$)/g, "");
                        const title = data.query.search[0].title;
                        const textLower = (title + " " + snippet).toLowerCase();

                        if (!matched) {
                            if (textLower.includes("vino rosso") || textLower.includes("a bacca nera")) {
                                document.getElementById('form-colore').value = "rosso";
                            } else if (textLower.includes("vino bianco") || textLower.includes("a bacca bianca")) {
                                document.getElementById('form-colore').value = "bianco";
                            } else if (textLower.includes("rosato") || textLower.includes("rosé")) {
                                document.getElementById('form-colore').value = "rose";
                            }

                            if (textLower.includes("spumante") || textLower.includes("metodo classico")) {
                                document.getElementById('form-stile').value = "spumante";
                            } else if (textLower.includes("frizzante")) {
                                document.getElementById('form-stile').value = "frizzante";
                            } else if (textLower.includes("passito") || textLower.includes("vino dolce")) {
                                document.getElementById('form-stile').value = "passito";
                            }
                        }

                        if (!document.getElementById('form-regione').value) {
                            const regioni = ["Piemonte", "Toscana", "Veneto", "Lombardia", "Sicilia", "Puglia", "Trentino", "Alto Adige", "Friuli", "Sardegna", "Campania", "Abruzzo", "Marche", "Umbria", "Emilia-Romagna", "Lazio", "Liguria", "Calabria", "Basilicata", "Molise", "Valle d'Aosta", "Champagne", "Bordeaux", "Borgogna"];
                            const foundReg = regioni.find(r => textLower.includes(r.toLowerCase()));
                            if (foundReg) {
                                document.getElementById('form-regione').value = foundReg;
                            }
                        }

                        if (!document.getElementById('form-note').value && snippet.length > 15) {
                            document.getElementById('form-note').value = snippet.trim() + "...";
                        }
                        matched = true;
                    }
                } catch (err) {}
            }

            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> <span class="text-[11px]">Compila</span>`;
            
            if (matched) {
                statusEl.innerText = "✨ Campi compilati automaticamente! Controlla o completa la cantina.";
                statusEl.className = "text-[10px] text-emerald-400 mt-1";
            } else {
                statusEl.innerText = "ℹ️ Vino specifico non trovato in automatico, inserisci i dettagli manualmente.";
                statusEl.className = "text-[10px] text-amber-300 mt-1";
            }
        }

        // Core Functions
        function saveToStorage() {
            localStorage.setItem('my_wine_cellar_db', JSON.stringify(wines));
            render();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-cantina').className = tab === 'cantina' 
                ? 'py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2 btn-gold shadow-md'
                : 'py-2 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white flex items-center justify-center gap-2';
            
            document.getElementById('tab-storico').className = tab === 'storico' 
                ? 'py-2 text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-2 btn-gold shadow-md'
                : 'py-2 text-xs font-semibold rounded-lg transition-all text-gray-400 hover:text-white flex items-center justify-center gap-2';

            render();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['all', 'rosso', 'bianco', 'rose', 'bollicine'].forEach(f => {
                const btn = document.getElementById(`filter-${f}`);
                if (f === filter) {
                    btn.className = 'px-3 py-1.5 rounded-lg bg-amber-500/20 text-amber-200 border border-amber-500/40 font-medium whitespace-nowrap';
                } else {
                    btn.className = 'px-3 py-1.5 rounded-lg bg-wine-card text-gray-300 border border-white/5 whitespace-nowrap';
                }
            });
            render();
        }

        function autocompleteRegion(val) {
            const suggBox = document.getElementById('cantina-suggestions');
            suggBox.innerHTML = '';
            if (!val.trim()) {
                suggBox.classList.add('hidden');
                return;
            }

            const matches = Object.keys(CANTINA_DB).filter(k => k.toLowerCase().includes(val.toLowerCase()));
            if (matches.length > 0) {
                suggBox.classList.remove('hidden');
                matches.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'p-2.5 hover:bg-white/10 cursor-pointer border-b border-white/5 text-xs flex justify-between items-center';
                    div.innerHTML = `<span class="font-semibold text-amber-100">${m}</span> <span class="text-[10px] text-gray-400">${CANTINA_DB[m]}</span>`;
                    div.onclick = () => {
                        document.getElementById('form-cantina').value = m;
                        document.getElementById('form-regione').value = CANTINA_DB[m];
                        suggBox.classList.add('hidden');
                    };
                    suggBox.appendChild(div);
                });
            } else {
                suggBox.classList.add('hidden');
            }
        }

        function render() {
            const listEl = document.getElementById('wine-list');
            const emptyEl = document.getElementById('empty-state');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            const cantinaCount = wines.filter(w => (w.qty || 0) > 0).reduce((acc, item) => acc + item.qty, 0);
            const storicoCount = wines.filter(w => w.history && w.history.length > 0).length;
            document.getElementById('count-cantina').innerText = cantinaCount;
            document.getElementById('count-storico').innerText = storicoCount;

            listEl.innerHTML = '';

            let filtered = wines.filter(w => {
                const inCantina = currentTab === 'cantina' ? (w.qty > 0) : (w.history && w.history.length > 0);
                if (!inCantina) return false;

                if (currentFilter === 'rosso' && w.colore !== 'rosso') return false;
                if (currentFilter === 'bianco' && w.colore !== 'bianco') return false;
                if (currentFilter === 'rose' && w.colore !== 'rose') return false;
                if (currentFilter === 'bollicine' && w.stile !== 'spumante' && w.stile !== 'frizzante') return false;

                const matchQuery = w.nome.toLowerCase().includes(searchVal) || 
                                   w.cantina.toLowerCase().includes(searchVal) || 
                                   (w.regione && w.regione.toLowerCase().includes(searchVal));
                return matchQuery;
            });

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            filtered.forEach(w => {
                const card = document.createElement('div');
                card.className = "bg-wine-card border border-wine-accent/40 rounded-2xl p-4 shadow-xl flex flex-col justify-between gap-3 relative overflow-hidden";

                let badgeColor = "bg-red-900/40 text-red-300 border-red-700/50";
                if (w.colore === 'bianco') badgeColor = "bg-amber-900/30 text-amber-200 border-amber-600/40";
                if (w.colore === 'rose') badgeColor = "bg-pink-900/30 text-pink-300 border-pink-700/40";

                const stars = '★'.repeat(w.voto || 0) + '☆'.repeat(5 - (w.voto || 0));

                let historyHTML = '';
                if (currentTab === 'storico' && w.history && w.history.length > 0) {
                    historyHTML = `
                        <div class="mt-2 pt-2 border-t border-white/5 text-[11px] space-y-1.5">
                            <span class="text-amber-300 font-semibold uppercase tracking-wider text-[9px]">Degustazioni Registrate:</span>
                            ${w.history.map(h => `
                                <div class="bg-black/30 p-2 rounded-lg border border-white/5">
                                    <div class="flex justify-between text-gray-400 font-medium">
                                        <span>📅 ${h.data || 'Data non indicata'}</span>
                                        <span class="text-amber-400">${'★'.repeat(h.voto || 0)}</span>
                                    </div>
                                    ${h.evento ? `<p class="text-amber-100 mt-0.5"><i class="fa-solid fa-champagne-glasses text-amber-400/80 mr-1"></i> ${h.evento}</p>` : ''}
                                    ${h.note ? `<p class="text-gray-400 italic text-[10px] mt-0.5">"${h.note}"</p>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <span class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider border ${badgeColor}">
                                    ${w.colore} • ${w.stile}
                                </span>
                                <h3 class="font-serif-title font-bold text-base text-amber-100 mt-1.5 leading-snug">${w.nome}</h3>
                                <p class="text-xs text-amber-200/80 font-medium">${w.cantina} ${w.annata ? `(${w.annata})` : ''}</p>
                            </div>
                            <button onclick="editWine('${w.id}')" class="text-gray-400 hover:text-amber-300 p-1">
                                <i class="fa-solid fa-pen-to-square text-sm"></i>
                            </button>
                        </div>

                        ${w.regione ? `<p class="text-[11px] text-gray-400 mt-1 flex items-center gap-1"><i class="fa-solid fa-location-dot text-amber-500/80"></i> ${w.regione}</p>` : ''}
                        
                        ${w.note ? `<p class="text-xs text-gray-300/80 mt-2 italic bg-black/20 p-2 rounded-lg border border-white/5">"${w.note}"</p>` : ''}
                        
                        ${historyHTML}
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-white/5 mt-1">
                        <div class="text-amber-400 text-xs tracking-widest" title="Valutazione">${stars}</div>
                        
                        ${currentTab === 'cantina' ? `
                            <div class="flex items-center gap-2 bg-black/40 px-2 py-1 rounded-xl border border-white/10">
                                <button onclick="changeQty('${w.id}', -1)" class="w-7 h-7 rounded-lg bg-wine-accent flex items-center justify-center text-white active:scale-90 font-bold">-</button>
                                <span class="text-sm font-bold text-white px-1.5">${w.qty}</span>
                                <button onclick="changeQty('${w.id}', 1)" class="w-7 h-7 rounded-lg bg-amber-600 flex items-center justify-center text-white active:scale-90 font-bold">+</button>
                            </div>
                        ` : `
                            <button onclick="readdOne('${w.id}')" class="px-3 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-semibold hover:bg-amber-500/30">
                                <i class="fa-solid fa-plus mr-1"></i> Ri-compra
                            </button>
                        `}
                    </div>
                `;

                listEl.appendChild(card);
            });
        }

        // Action Handlers
        function openModal(editId = null) {
            document.getElementById('wine-form').reset();
            document.getElementById('wine-id').value = '';
            document.getElementById('modal-title').innerText = "Nuova Bottiglia";
            document.getElementById('cantina-suggestions').classList.add('hidden');
            document.getElementById('autofill-status').classList.add('hidden');

            if (editId) {
                const w = wines.find(item => item.id === editId);
                if (w) {
                    document.getElementById('wine-id').value = w.id;
                    document.getElementById('modal-title').innerText = "Modifica Vino";
                    document.getElementById('form-nome').value = w.nome;
                    document.getElementById('form-cantina').value = w.cantina;
                    document.getElementById('form-regione').value = w.regione || '';
                    document.getElementById('form-colore').value = w.colore;
                    document.getElementById('form-stile').value = w.stile;
                    document.getElementById('form-annata').value = w.annata || '';
                    document.getElementById('form-quantita').value = w.qty;
                    document.getElementById('form-voto').value = w.voto || 0;
                    document.getElementById('form-note').value = w.note || '';
                }
            }

            document.getElementById('modal-wine').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-wine').classList.add('hidden');
        }

        function editWine(id) {
            openModal(id);
        }

        function saveWine(e) {
            e.preventDefault();
            const id = document.getElementById('wine-id').value;
            const nome = document.getElementById('form-nome').value.trim();
            const cantina = document.getElementById('form-cantina').value.trim();
            const regione = document.getElementById('form-regione').value.trim();
            const colore = document.getElementById('form-colore').value;
            const stile = document.getElementById('form-stile').value;
            const annata = document.getElementById('form-annata').value;
            const qty = parseInt(document.getElementById('form-quantita').value) || 0;
            const voto = parseInt(document.getElementById('form-voto').value) || 0;
            const note = document.getElementById('form-note').value.trim();

            if (id) {
                const index = wines.findIndex(w => w.id === id);
                if (index !== -1) {
                    wines[index] = { ...wines[index], nome, cantina, regione, colore, stile, annata, qty, voto, note };
                }
            } else {
                const newWine = {
                    id: 'wine_' + Date.now(),
                    nome, cantina, regione, colore, stile, annata, qty, voto, note,
                    history: []
                };
                wines.unshift(newWine);
            }

            saveToStorage();
            closeModal();
        }

        function changeQty(id, delta) {
            const wine = wines.find(w => w.id === id);
            if (!wine) return;

            if (delta < 0) {
                openDrinkModal(wine);
            } else {
                wine.qty = Math.max(0, wine.qty + delta);
                saveToStorage();
            }
        }

        function readdOne(id) {
            const wine = wines.find(w => w.id === id);
            if (wine) {
                wine.qty = (wine.qty || 0) + 1;
                saveToStorage();
                switchTab('cantina');
            }
        }

        function openDrinkModal(wine) {
            document.getElementById('drink-wine-id').value = wine.id;
            document.getElementById('drink-wine-name').innerText = `${wine.nome} - ${wine.cantina} ${wine.annata ? `(${wine.annata})` : ''}`;
            document.getElementById('drink-date').value = new Date().toISOString().split('T')[0];
            document.getElementById('drink-evento').value = '';
            document.getElementById('drink-note').value = '';
            document.getElementById('drink-voto').value = wine.voto || 5;
            document.getElementById('modal-drink').classList.remove('hidden');
        }

        function closeDrinkModal() {
            document.getElementById('modal-drink').classList.add('hidden');
        }

        function confirmDrink(e) {
            e.preventDefault();
            const id = document.getElementById('drink-wine-id').value;
            const wine = wines.find(w => w.id === id);
            if (wine) {
                wine.qty = Math.max(0, (wine.qty || 1) - 1);
                if (!wine.history) wine.history = [];
                wine.history.unshift({
                    data: document.getElementById('drink-date').value,
                    evento: document.getElementById('drink-evento').value.trim(),
                    voto: parseInt(document.getElementById('drink-voto').value),
                    note: document.getElementById('drink-note').value.trim()
                });
                wine.voto = parseInt(document.getElementById('drink-voto').value);
                saveToStorage();
            }
            closeDrinkModal();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(wines, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `cantina_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        wines = imported;
                        saveToStorage();
                        alert("Backup ripristinato con successo!");
                    }
                } catch (err) {
                    alert("File non valido.");
                }
            };
            reader.readAsText(file);
        }

        // Init
        updateNetworkStatus();
        render();
    </script>
</body>
